<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>Olympiade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080a0f; --bg2:#0d111a;
  --card:#131923; --card2:#182030;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --ink:#eef2f8; --dim:#98a3b8; --dim2:#6b7789;
  --acc:#5b8cff; --acc2:#8b5cf6; --acc3:#22d3ee;
  --ok:#34d399; --warn:#fb923c; --bad:#f87171;
  --g1:#fbbf24; --g2:#cbd5e1; --g3:#c2823f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;color:var(--ink);background:var(--bg);position:relative;overflow-x:hidden;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 16px calc(44px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 42% at 50% -6%, rgba(91,140,255,.28), transparent 62%),
    radial-gradient(52% 34% at 108% 12%, rgba(139,92,246,.22), transparent 60%),
    radial-gradient(60% 40% at -12% 32%, rgba(34,211,238,.14), transparent 62%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg) 46%);
}
.wrap{max-width:540px;margin:0 auto;padding-top:calc(30px + env(safe-area-inset-top))}

/* Kopf */
.brand{text-align:center;margin-bottom:22px;position:relative}
.ringe{position:relative;width:100%;max-width:290px;margin:0 auto 18px;
  aspect-ratio:300/140}
.or{position:absolute;width:28%;aspect-ratio:1;border-radius:50%;
  border:5px solid;overflow:hidden;
  background:rgba(255,255,255,.055);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.or img{width:100%;height:100%;object-fit:cover;display:block}
.or.r1{left:6%;top:7.1%;border-color:#0081C8;z-index:1}
.or.r2{left:36%;top:7.1%;border-color:#f2f5fa;z-index:1}
.or.r3{left:66%;top:7.1%;border-color:#EE334E;z-index:1}
.or.r4{left:21%;top:35.7%;border-color:#FCB131;z-index:2}
.or.r5{left:51%;top:35.7%;border-color:#00A651;z-index:2}
.mark{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--dim);margin-bottom:13px}

@media (max-height:740px){
  .wrap{padding-top:calc(18px + env(safe-area-inset-top))}
  .ringe{max-width:212px;margin-bottom:12px}
  .brand{margin-bottom:14px}
  h1{font-size:29px}
}
h1{
  font-size:34px;line-height:1;letter-spacing:-.02em;margin:0;font-weight:800;
  background:linear-gradient(115deg,#fff 12%,var(--acc) 52%,var(--acc2) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--dim2);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:11px 0 0}
.status{
  display:inline-flex;align-items:center;gap:7px;margin-top:15px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);
}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--dim2)}
.sdot.live{background:var(--ok);box-shadow:0 0 9px rgba(52,211,153,.85)}
.sdot.off{background:var(--warn);box-shadow:0 0 9px rgba(251,146,60,.7)}

/* Tabs */
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;padding:11px 3px;text-align:center;font-size:11.5px;font-weight:650;
  letter-spacing:.02em;border-radius:10px;color:var(--dim);cursor:pointer;transition:.16s}
.tab.on{background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;
  box-shadow:0 5px 18px rgba(91,140,255,.35)}

/* Karten */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.42)}
h2{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);
  margin:0 0 15px;font-weight:700;display:flex;align-items:center;gap:9px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* Podium */
.pod{display:flex;align-items:flex-end;gap:9px;margin-bottom:14px}
.pcol{flex:1;text-align:center;border-radius:16px;padding:15px 7px 13px;position:relative;
  background:var(--card);border:1px solid var(--line);overflow:hidden}
.pcol::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--dim2)}
.pcol.p1{padding-top:22px;background:linear-gradient(170deg,rgba(251,191,36,.16),var(--card) 62%);
  border-color:rgba(251,191,36,.4)}
.pcol.p1::before{background:linear-gradient(90deg,transparent,var(--g1),transparent)}
.pcol.p2::before{background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.pcol.p3::before{background:linear-gradient(90deg,transparent,var(--g3),transparent)}
.pmed{width:27px;height:27px;margin:0 auto 8px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0a0c10}
.p1 .pmed{background:linear-gradient(140deg,#fde68a,var(--g1))}
.p2 .pmed{background:linear-gradient(140deg,#f1f5f9,var(--g2))}
.p3 .pmed{background:linear-gradient(140deg,#e0a86a,var(--g3))}
.pnm{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppt{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.p1 .ppt{color:var(--g1)}.p2 .ppt{color:var(--g2)}.p3 .ppt{color:var(--g3)}

/* Rangliste */
.rank{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-of-type{border-bottom:0}
.pos{width:25px;height:25px;border-radius:8px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:750;color:var(--dim);
  background:rgba(255,255,255,.055);border:1px solid var(--line)}
.rank.top .pos{background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.nm{flex:1;font-size:15.5px;font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{font-size:17px;font-weight:800;letter-spacing:-.02em;flex:none}
.tie{font-size:10px;color:var(--warn);border:1px solid rgba(251,146,60,.4);border-radius:6px;
  padding:2px 6px;flex:none;letter-spacing:.06em}

/* Disziplinen */
.disz{border-bottom:1px solid var(--line);padding:12px 0}
.disz:last-child{border-bottom:0}
.dhead{display:flex;align-items:center;gap:12px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.dot.done{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.6)}
.dinfo{flex:1;min-width:0}
.dname{font-size:15px;font-weight:600}
.dmeta{font-size:11px;color:var(--dim2);margin-top:2px}
.chev{color:var(--dim2);font-size:12px;flex:none;transition:transform .2s}
.disz.open .chev{transform:rotate(90deg)}
.dbody{display:none;padding:13px 0 3px 20px}
.disz.open .dbody{display:block;animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dtext{font-size:13.5px;color:#c3ccdb;line-height:1.66}
.dmat{font-size:12px;color:var(--dim2);margin-top:9px;padding-left:11px;
  border-left:2px solid var(--line2)}
.runden{margin:13px 0 3px;padding-top:11px;border-top:1px solid var(--line)}
.rd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;color:var(--dim);padding:5px 0}
.rdx{background:transparent;color:var(--bad);font-size:17px;line-height:1;padding:0 5px}
.teams{margin:11px 0 3px;font-size:12.5px;color:var(--dim);line-height:1.85}
.teams b{color:var(--acc);margin-right:7px;font-weight:650}

/* Buttons */
button{font:inherit;border:0;cursor:pointer}
.btn{width:100%;padding:13px;font-size:14.5px;font-weight:680;border-radius:12px;
  background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;margin-top:9px;
  box-shadow:0 6px 18px rgba(91,140,255,.28);transition:.14s}
.btn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(91,140,255,.24)}
.btn.ghost{background:rgba(255,255,255,.055);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.warn{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.32);box-shadow:none}
.btn.sm{padding:10px;font-size:13px;margin-top:7px}
.winrow{display:flex;gap:8px;margin-top:7px}
.winrow .btn{margin-top:0}
.lnk{display:block;text-align:center;text-decoration:none;line-height:1.35}

input,select,textarea{width:100%;padding:12px;font-size:15px;border:1px solid var(--line2);
  border-radius:11px;background:rgba(255,255,255,.05);color:var(--ink);margin-bottom:9px;
  font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(91,140,255,.16)}
select option{background:#141922;color:var(--ink)}
textarea{resize:vertical}
label{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim2);margin:12px 0 6px;font-weight:600}

/* Auswahl */
.pick{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);
  cursor:pointer;transition:.13s}
.pick.sel{background:rgba(91,140,255,.16);border-color:var(--acc)}
.pick.t1{background:rgba(91,140,255,.16);border-color:var(--acc)}
.pick.t2{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.55)}
.pick .num{width:25px;height:25px;border-radius:8px;background:rgba(255,255,255,.07);
  color:var(--dim2);font-size:12px;font-weight:750;display:flex;align-items:center;
  justify-content:center;flex:none}
.pick.sel .num,.pick.t1 .num{background:var(--acc);color:#fff}
.pick.t2 .num{background:var(--ok);color:#06281c}
.pick .gain{font-size:12.5px;font-weight:700;color:var(--dim2);flex:none}
.pick.sel .gain,.pick.t1 .gain{color:var(--acc)}
.pick.t2 .gain{color:var(--ok)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(4,6,10,.7);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheetin{width:100%;max-width:540px;max-height:90dvh;overflow-y:auto;background:var(--card2);
  border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;
  padding:14px 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 15px}
.sheetin h3{margin:0 0 7px;font-size:19px;font-weight:700;letter-spacing:-.01em}

.hint{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.settle{font-size:13.5px;line-height:1.95;color:var(--dim)}
.settle b{color:var(--ink);font-weight:650}
.empty{text-align:center;color:var(--dim2);font-size:14px;padding:26px 0}
.ro{background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.28);border-radius:12px;
  padding:11px;font-size:12.5px;text-align:center;margin-bottom:14px;color:#c3ccdb}
.skyline{position:fixed;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;
  height:118px;opacity:.5;
  background:linear-gradient(180deg,rgba(91,140,255,0) 0%,rgba(91,140,255,.75) 62%,
    rgba(139,92,246,.7) 100%);
  -webkit-mask:url('skyline.svg') center bottom / auto 118px repeat-x;
  mask:url('skyline.svg') center bottom / auto 118px repeat-x;
}
.runden{margin:12px 0 4px;border-top:1px dashed rgba(224,182,74,.2);padding-top:10px}
.rd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;color:#b5aa98;padding:5px 0}
.rdx{background:transparent;color:#ff9d8a;font-size:17px;line-height:1;padding:0 4px}
.teams{margin:10px 0 2px;font-size:12.5px;color:#b5aa98;line-height:1.9}
.teams b{color:var(--gold);letter-spacing:.06em;margin-right:6px}
.pick.t1{background:rgba(224,182,74,.18);border-color:var(--gold)}
.pick.t2{background:rgba(123,191,106,.16);border-color:rgba(123,191,106,.6)}
.pick.t1 .num{background:var(--gold);color:#1b1710}
.pick.t2 .num{background:#7bbf6a;color:#12200e}
.winrow{display:flex;gap:8px;margin-top:6px}
.winrow .btn{margin-top:0}
.lnk{display:block;text-align:center;text-decoration:none;box-sizing:border-box;line-height:1.3}
textarea{resize:vertical}
.foot{text-align:center;color:var(--dim2);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;margin-top:30px;opacity:.6}
</style>
</head>
<body>

  <div class="brand">
    <div class="ringe">
      <div class="or r1"><img src="img/f1.jpg" alt="" onerror="this.remove()"></div>

      <div class="or r3"><img src="img/f3.jpg" alt="" onerror="this.remove()"></div>
      <div class="or r4"><img src="img/f4.jpg" alt="" onerror="this.remove()"></div>

</div>
<div class="skyline"></div>
<div class="sheet" id="sheet"><div class="sheetin" id="sheetin"></div></div>

const ROW='jga2026', KEY='jga_olymp_v3';
const ADMIN=new URLSearchParams(location.search).has('admin');
const KAT={"d":[{"id":"flunky","n":"Flunkyball","kat":"team","modus":"gruppe","win":8,"lose":4,"b":"Zwei Teams stehen sich in zwei Reihen gegenüber, in der Mitte steht eine leere Flasche. Ein Team wirft mit einem Ball auf die Flasche. Fällt sie um, trinken alle aus dem werfenden Team, bis das gegnerische Team die Flasche wieder aufgestellt und den Werfer zurückgeholt hat. Das Team, das zuerst ausgetrunken hat, gewinnt. Bei mehr als zwei Teams spielt einen Turnierbaum mit vier Teams, nicht mit dreien: Bei drei Teams gewinnt erfahrungsgemäß jeder einmal und ihr steht vor einem Patt. Mit vier Teams sind es zwei Halbfinals, ein Finale und ein Spiel um Platz drei, und die Reihenfolge steht eindeutig fest.","m":"Ein Ball, eine leere Flasche als Ziel, Getränke in Dosen","link":"","gsize":2,"auto":false,"wdh":false,"faktor":1},{"id":"ttt","n":"Schubkarren-Tic-Tac-Toe","kat":"team","modus":"gruppe","win":8,"lose":4,"b":"Ein Spielfeld mit neun Feldern wird auf den Boden geklebt. Jedes Team bekommt drei Tücher in seiner Farbe. Zwei Personen bilden ein Gespann, eine ist die Schubkarre, eine schiebt. Auf Los geht es zum Feld, ein Tuch wird abgelegt, zurück werden die Rollen getauscht, dann startet das nächste Paar. Liegen alle drei Tücher, dürfen sie im Feld verschoben werden. Wer drei in einer Reihe hat, gewinnt. Bei mehr als zwei Teams spielt einen Turnierbaum mit vier Teams, nicht mit dreien: Bei drei Teams gewinnt erfahrungsgemäß jeder einmal und ihr steht vor einem Patt. Mit vier Teams sind es zwei Halbfinals, ein Finale und ein Spiel um Platz drei, und die Reihenfolge steht eindeutig fest.","m":"Klebeband, sechs Tücher in zwei Farben","link":"","gsize":2,"auto":false,"wdh":false,"faktor":1},{"id":"beerpong","n":"Beerpong","kat":"team","modus":"gruppe","win":8,"lose":4,"b":"Zwei Teams stehen sich an einem Tisch gegenüber, vor jedem stehen Becher in Dreiecksform. Abwechselnd wird versucht, einen Tischtennisball in einen gegnerischen Becher zu werfen. Wer getroffen wird, trinkt den Becher aus und stellt ihn beiseite. Das Team, das zuerst alle gegnerischen Becher trifft, gewinnt. Bei mehr als zwei Teams spielt einen Turnierbaum mit vier Teams, nicht mit dreien: Bei drei Teams gewinnt erfahrungsgemäß jeder einmal und ihr steht vor einem Patt. Mit vier Teams sind es zwei Halbfinals, ein Finale und ein Spiel um Platz drei, und die Reihenfolge steht eindeutig fest.","m":"Becher, Tischtennisbälle, Getränke","link":"","gsize":2,"auto":false,"wdh":false,"faktor":1},{"id":"kubb","n":"Kubb","kat":"team","modus":"gruppe","win":8,"lose":4,"b":"Zwei Teams werfen abwechselnd mit Wurfhölzern. Erst müssen alle Holzklötze der Gegenseite umgeworfen werden, danach der König in der Feldmitte. Wer den König zu früh trifft, hat sofort verloren. Braucht etwa acht mal zwölf Meter freie Fläche. Bei mehr als zwei Teams spielt einen Turnierbaum mit vier Teams, nicht mit dreien: Bei drei Teams gewinnt erfahrungsgemäß jeder einmal und ihr steht vor einem Patt. Mit vier Teams sind es zwei Halbfinals, ein Finale und ein Spiel um Platz drei, und die Reihenfolge steht eindeutig fest.","m":"Kubb-Set","link":"","gsize":2,"auto":false,"wdh":false,"faktor":1},{"id":"boule","n":"Boule","kat":"team","modus":"gruppe","win":8,"lose":4,"b":"Mit vier Kugelfarben zu je zwei Stück treten bis zu vier Teams gleichzeitig an, ein Turnierbaum ist nicht nötig. Pro Runde wird zuerst die Zielkugel geworfen, danach platziert jedes Team abwechselnd seine Kugeln. Wessen Kugel am Ende am nächsten liegt, gewinnt die Runde. Spielt mindestens fünf Runden und zählt, wie oft jedes Team vorn lag, dann entscheidet nicht ein einzelner Glückswurf. Bei größeren Teams wechselt ihr euch rundenweise mit dem Werfen ab.","m":"Boule-Set mit Zielkugel","link":"","gsize":2,"auto":false,"wdh":false,"faktor":1},{"id":"turm","n":"Turmbau-Challenge","kat":"team","modus":"gruppe","win":8,"lose":4,"b":"Beide Teams bekommen gleich viel Material und dieselbe Zeit, meist zehn Minuten. Gebaut wird ein möglichst hoher und stabiler Turm, auf dessen Spitze ein Apfel Platz haben muss. Nach Ablauf der Zeit wird der Apfel aufgelegt, der Turm muss eine Minute frei stehen bleiben. Braucht einen festen ebenen Untergrund, auf Wiese funktioniert es nicht. Hier können alle Teams gleichzeitig antreten, ein Turnierbaum ist nicht nötig.","m":"Papier, Klebeband, Becher, ein Apfel, fester ebener Untergrund","link":"","gsize":2,"auto":false,"wdh":false,"faktor":1},{"id":"flip7","n":"Flip 7 im Team","kat":"team","modus":"paar","gsize":3,"auto":true,"faktor":1.5,"b":"Gespielt wird in Teams, die Größe stellst du beim Eintragen ein. Zwei gegen zwei geht genauso wie fünf gegen fünf, bei vielen Leuten sind größere Teams angenehmer. Jeder deckt für sich auf, gewertet wird die gemeinsame Punktzahl des Teams. Legt vorher ein Ziel fest, als Richtwert etwa 170 Punkte pro Person im Team, bei Dreierteams also 500. Der Reiz sind die Aktionskarten, die ihr frei verteilen dürft: Freeze beendet den Zug einer Person sofort, Flip Three zwingt sie zu drei weiteren Karten, Second Chance schützt einmal vor dem Überkaufen. Damit bremst ihr führende Gegner aus und sichert eigene Leute ab. Sieben verschiedene Zahlen in einer Runde bringen 15 Bonuspunkte.","m":"Flip 7","link":"","wdh":false},{"id":"ballon","n":"Ballon zwischen den Körpern","kat":"partner","modus":"paar","gsize":2,"auto":true,"b":"Zweierteams klemmen einen Luftballon zwischen ihre Körper und laufen damit einen Slalom um leere Flaschen und zurück, ohne ihn mit den Händen zu berühren. Fällt der Ballon zu Boden, wird an dieser Stelle neu gestartet. Das schnellste Team gewinnt. Beide Partner bekommen dieselbe Platzierung, also direkt nacheinander antippen.","m":"Luftballons","link":"","wdh":false,"faktor":1},{"id":"zeit","n":"Zeitgefühl","kat":"partner","modus":"paar","gsize":2,"auto":true,"b":"Zwei Personen bilden ein Team und schätzen gemeinsam genau zwei Minuten. Die Stoppuhr läuft mit verdeckter Anzeige. Es wird abwechselnd übergeben, und jeder muss zweimal let db=null, live=false, dirty=false, AUSWAHL=[], OFFEN={}, TEILN=0, BEARB=null, TEAM={}, MODUS='rang', CURD=null, STECH=[], GRUPPEN=null, GRANG=[];

function leer(){ return {spieler:[], disz:JSON.parse(JSON.stringify(KAT.d)), log:[], teams:{}, stand:0}; }
/* Katalog nachziehen: gespeicherte Stände kennen nur die Disziplinen von damals.
   Wir bauen die Liste immer neu aus KAT.d und retten nur die Einstellungen. */
function mitKat(st){
  if(!st||typeof st!=='object') return leer();
  const alt={}; (st.disz||[]).forEach(d=>{ if(d&&d.id) alt[d.id]=d; });
  const ids={};
  st.disz=JSON.parse(JSON.stringify(KAT.d)).map(d=>{
    ids[d.id]=1;
    const a=alt[d.id];
    /* Nur was der Spielleiter im Setup selbst gespeichert hat, wird uebernommen.
       Alte Standardwerte werden vom Katalog ueberschrieben. */
    if(a&&a.eigen){
      ['auto','pts','faktor','modus','gsize','wdh'].forEach(k=>{
        if(a[k]!==undefined) d[k]=a[k];
      });
      d.eigen=true;
    }
    return d;
  });
  /* Selbst angelegte Disziplinen bleiben erhalten */
  (st.disz0||[]).length;
  Object.keys(alt).forEach(id=>{ if(!ids[id]&&alt[id].eigen) st.disz.push(alt[id]); });
  if(!st.spieler) st.spieler=[]; if(!st.log) st.log=[]; if(!st.teams) st.teams={};
  return st;
}

let S=(function(){ try{const r=localStorage.getItem(KEY); if(r) return mitKat(JSON.parse(r));}catch(e){} return leer(); })();

/* Punkteskala automatisch aus Teilnehmerzahl */
function skala(n, faktor){
  const a=[];
  for(let i=0;i<n;i++){
    let p=n-i;
    if(i===0) p+=2; else if(i===1) p+=1;
    a.push(Math.ceil(p*(faktor===undefined?1:faktor)));
  }
  return a;
}
function ptsVon(d,n){
  const m=(d===CURD?MODUS:d.modus);
  if(m==='paar') return skala(Math.max(2, n||2), d.faktor);
  if(m!=='rang') return [];
  if(d.auto) return skala(n||S.spieler.length, d.faktor);
  return (d.pts||[]).map(x=>Math.ceil(x*(d.faktor===undefined?1:d.faktor)));
}
function regeltext(d){
  if(d.modus==='gruppe'||d.modus==='paar') return 'Teams oder Gruppen';
  if(d.auto) return 'Einzelwertung'+(d.faktor&&d.faktor!==1?', Faktor '+String(d.faktor).replace('.',','):'');
  return 'Einzelwertung, '+ptsVon(d).join(' / ');
}
function runden(id){ return S.log.filter(r=>r.d===id); }

function punkte(){
  const p={}; S.spieler.forEach(s=>p[s]=0);
  S.log.forEach(r=>Object.keys(r.p).forEach(s=>{ if(p[s]!==undefined) p[s]+=r.p[s]; }));
  return p;
}
function tabelle(){
  const p=punkte();
  return S.spieler.map(s=>({n:s,p:p[s]})).sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n));
}

/* Speichern und Sync */
function save(){ S.stand=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} push(); }
function stat(t,c){ const d=document.getElementById('sdot'),x=document.getElementById('stxt');
  if(!d)return; d.className='sdot'+(c?' '+c:''); x.textContent=t; }
async function push(){
  if(!db||!ADMIN) return;
  try{ const {error}=await db.from('olympiade').upsert({id:ROW,data:S,updated_at:new Date().toISOString()});
    if(error) throw error; dirty=false; stat('gespeichert','live');
    setTimeout(()=>{ if(!dirty) stat(live?'live':'verbunden','live'); },1300);
  }catch(e){ dirty=true; stat('offline, wird nachgeholt','off'); }
}
async function pull(){
  if(!db) return;
  try{ const {data,error}=await db.from('olympiade').select('data').eq('id',ROW).maybeSingle();
    if(error) throw error;
    if(data&&data.data){ const r=data.data;
      if(!S.stand||(r.stand||0)>=S.stand){ S=mitKat(r); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} alles(); }
      else if(ADMIN) push();
    } else if(ADMIN) push();
    stat(live?'live':'verbunden','live');
  }catch(e){ stat('offline','off'); }
}
function verbinde(){
  if(!window.supabase){ stat('nur lokal','off'); return; }
  db=window.supabase.createClient(SUPA_URL,SUPA_KEY); pull();
  db.channel('olymp').on('postgres_changes',
    {event:'*',schema:'public',table:'olympiade',filter:'id=eq.'+ROW},p=>{
      const r=p.new&&p.new.data; if(!r) return;
      if((r.stand||0)>(S.stand||0)){ S=mitKat(r); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} alles(); }
    }).subscribe(st=>{ live=(st==='SUBSCRIBED'); stat(live?'live':'verbunden','live'); });
  setInterval(()=>{ if(dirty) push(); },8000);
  window.addEventListener('online',()=>{ pull(); if(dirty) push(); });
}

/* Tabelle */
function rTab(){
  const el=document.getElementById('tab');
  if(!S.spieler.length){
    el.innerHTML='<div class="card"><div class="empty">Noch keine Spieler angelegt.'
      +(ADMIN?'<br>Leg sie unter Setup an.':'')+'</div></div>'; return;
  }
  const t=tabelle();
  let h='';
  if(t.length>=3){
    h+='<div class="pod">';
    [1,0,2].forEach(i=>h+='<div class="pcol p'+(i+1)+'"><div class="pmed">'+(i+1)+'</div>'
      +'<div class="pnm">'+esc(t[i].n)+'</div><div class="ppt">'+t[i].p+'</div></div>');
    h+='</div>';
  }
  const gr=gleichstaende();
  const inGleich={}; gr.forEach(g=>g.namen.forEach(n=>inGleich[n]=g.rel));

  h+='<div class="card"><h2>Gesamtwertung</h2>';
  t.forEach((r,i)=>h+='<div class="rank'+(i<3?' top':'')+'"><div class="pos">'+(i+1)+'</div>'
    +'<div class="nm">'+esc(r.n)+'</div>'
    +(inGleich[r.n]!==undefined?'<div class="tie">'+(inGleich[r.n]?'Stechen':'gleich')+'</div>':'')
    +'<div class="pt">'+r.p+'</div></div>');
  h+='<button class="btn ghost" onclick="teilen()">Stand teilen</button></div>';

  if(gr.length && ADMIN){
    h+='<div class="card"><h2>Gleichstand</h2>';
    gr.forEach((g,i)=>{
      h+='<div class="hint" style="margin-bottom:6px"><b style="color:var(--ink)">'
        +esc(g.namen.join(', '))+'</b> &middot; je '+g.p+' Punkte'
        +(g.rel?' &middot; <span style="color:var(--warn)">entscheidet über '
          +(g.oben?'die Freigetränke':'die Zeche')+'</span>':' &middot; ohne Folgen')+'</div>'
        +'<button class="btn'+(g.rel?'':' ghost')+'" style="margin-bottom:10px" '
        +'onclick="stechen('+i+')">Stechen für diese Gruppe</button>';
    });
    h+='<div class="hint" style="margin:2px 0 0">Schere, Stein, Papier auf drei Gewinnspiele. '
      +'Der Sieger bekommt einen Punkt.</div></div>';
  }
  if(t.length>=6){
    const top=t.slice(0,3), bot=t.slice(-3).reverse();
    h+='<div class="card"><h2>Getränke am Ende</h2><div class="settle">';
    [3,2,1].forEach((g,i)=>{ if(top[i]) h+='<b>'+esc(top[i].n)+'</b> bekommt '+g+'<br>'; });
    h+='<div style="height:10px"></div>';
    [3,2,1].forEach((g,i)=>{ if(bot[i]) h+='<b>'+esc(bot[i].n)+'</b> zahlt '+g+'<br>'; });
    h+='</div></div>';
  }
  h+=duelle();
  el.innerHTML=h;
}
/* Wer hat schon gegen wen gespielt. Kommt komplett aus dem Protokoll,
   niemand muss dafuer etwas zusaetzlich eintragen. */
function duelle(){
  const mini={}; S.disz.forEach(d=>{ if(d.kat==='mini') mini[d.id]=d.n; });
  const paare=[], zahl={};
  S.spieler.forEach(sp=>zahl[sp]=0);
  S.log.forEach(r=>{
    if(!mini[r.d]) return;
    const wer=Object.keys(r.p||{}).filter(n=>S.spieler.indexOf(n)>=0);
    if(wer.length!==2) return;
    wer.forEach(n=>zahl[n]++);
    paare.push({a:wer[0], b:wer[1], d:mini[r.d]});
  });
  if(!paare.length) return '';
  const nie=S.spieler.filter(sp=>!zahl[sp]);
  let h='<div class="card"><h2>Duelle</h2>'
    +'<div class="hint">'+paare.length+' gespielt. So oft war jeder beteiligt:</div>'
    +'<div class="settle">';
  S.spieler.slice().sort((x,y)=>zahl[y]-zahl[x]).forEach(sp=>{
    h+='<b>'+esc(sp)+'</b> '+zahl[sp]+'<br>';
  });
  h+='</div>';
  if(nie.length) h+='<div class="hint" style="margin-top:8px;color:var(--warn)">Noch nie dabei: '
    +nie.map(esc).join(', ')+'</div>';
  h+='<div class="hint" style="margin-top:8px">'
    +paare.slice(-6).reverse().map(x=>esc(x.a)+' gegen '+esc(x.b)+' &middot; '+esc(x.d)).join('<br>')
    +'</div></div>';
  return h;
}

/* Stechen bei Gleichstand */
function gleichstaende(){
  const t=tabelle();
  if(!S.log.length || t.length<2) return [];
  const nach={};
  t.forEach((r,i)=>{ (nach[r.p]=nach[r.p]||[]).push({n:r.n,i:i}); });
  const raus=[];
  Object.keys(nach).forEach(p=>{
    const g=nach[p];
    if(g.length<2) return;
    const oben=g.some(x=>x.i<3), unten=g.some(x=>x.i>=t.length-3);
    raus.push({p:+p, namen:g.map(x=>x.n), rel:(oben||unten)&&t.length>=6, oben:oben});
  });
  return raus.sort((a,b)=>b.p-a.p);
}
function stechen(idx){
  const gr=gleichstaende(), g=gr[idx||0];
  if(!g){ alert('Kein Gleichstand.'); return; }
  AUSWAHL=[]; STECH=g.namen.slice();
  document.getElementById('sheetin').innerHTML=
    '<div class="grip"></div><h3>Stechen</h3>'
    +'<div class="hint">'+esc(g.namen.join(', '))+' liegen bei je '+g.p+' Punkten. '
    +'Schere, Stein, Papier auf drei Gewinnspiele. Tippe sie in der Reihenfolge des Ergebnisses an, '
    +'der Sieger zuerst.</div><div id="picks"></div>'
    +'<button class="btn" onclick="stechenSpeichern()">Speichern</button>'
    +'<button class="btn ghost" onclick="zu()">Abbrechen</button>';
  stechenPicks();
  document.getElementById('sheet').classList.add('on');
}
function stechenPicks(){
  const n=STECH.length;
  let h='';
  STECH.forEach(sp=>{
    const i=AUSWAHL.indexOf(sp), sel=i>=0, bonus=sel?(n-1-i):null;
    h+='<div class="pick'+(sel?' sel':'')+'" onclick="stechenTipp(\''+esc(sp).replace(/'/g,'')+'\')">'
      +'<div class="num">'+(sel?i+1:'&middot;')+'</div><div class="nm">'+esc(sp)+'</div>'
      +'<div class="gain">'+(sel?'+'+bonus:'')+'</div></div>';
  });
  document.getElementById('picks').innerHTML=h;
}
function stechenTipp(n){
  const i=AUSWAHL.indexOf(n);
  if(i>=0) AUSWAHL.splice(i,1); else AUSWAHL.push(n);
  stechenPicks();
}
function stechenSpeichern(){
  if(AUSWAHL.length<STECH.length){
    alert('Bitte alle '+STECH.length+' in der Reihenfolge antippen.'); return;
  }
  const n=STECH.length, p={};
  AUSWAHL.forEach((sp,i)=>{ const b=n-1-i; if(b>0) p[sp]=b; });
  S.log.push({rid:'r'+Date.now()+Math.random().toString(36).slice(2,6),
              d:'__stechen', ts:Date.now(), p:p});
  save(); zu(); alles();
}

/* Spiele, nach Kategorien */
function rSpiele(){
  const el=document.getElementById('spiele');
  let h='';
  if(!ADMIN) h+='<div class="ro">Nur-Lese-Ansicht. Eingetragen wird vom Spielleiter.</div>';
  KAT.k.forEach(([k,titel])=>{
    const liste=S.disz.filter(d=>(d.kat||'einzel')===k);
    if(!liste.length) return;
    h+='<div class="card"><h2>'+titel+'</h2>';
    liste.forEach(d=>{
      const rd=runden(d.id), op=OFFEN[d.id];
      h+='<div class="disz'+(op?' open':'')+'"><div class="dhead" onclick="klapp(\''+d.id+'\')">'
        +'<div class="dot'+(rd.length?' done':'')+'"></div><div class="dinfo">'
        +'<div class="dname">'+esc(d.n)+'</div><div class="dmeta">'+regeltext(d)
        +(rd.length?' &middot; '+rd.length+'x gespielt':'')+'</div></div>'
        +'<div class="chev">&#10095;</div></div><div class="dbody">'
        +'<div class="dtext">'+esc(d.b||'Keine Beschreibung hinterlegt.')+'</div>'
        +(d.m?'<div class="dmat">Material: '+esc(d.m)+'</div>':'')
        +(d.pool&&d.pool.length?'<button class="btn ghost sm" style="margin-top:8px" '
          +'onclick="event.stopPropagation();losePool(\''+d.id+'\')">Auslosen</button>'
          +'<div class="dmat" id="pool_'+d.id+'" style="margin-top:6px"></div>':'')
        +(d.link?'<a class="btn sm lnk" href="'+d.link+'">Seite öffnen</a>':'');
      if(rd.length){
        h+='<div class="runden">';
        rd.forEach((r,i)=>{
          const wer=Object.keys(r.p).sort((a,b)=>r.p[b]-r.p[a])
            .filter(s=>r.p[s]===Math.max.apply(null,Object.values(r.p)));
          h+='<div class="rd"><span>'+(i+1)+'. '+esc(wer.join(', '))+'</span>'
            +(ADMIN?'<button class="rdx" onclick="wegRunde(\''+r.rid+'\')">&times;</button>':'')+'</div>';
        });
        h+='</div>';
      }
      const tm=S.teams&&S.teams[d.id];
      if(tm&&d.modus==='gruppe'&&(tm.a.length||tm.b.length)){
        h+='<div class="teams"><div><b>Team 1</b> '+esc(tm.a.join(', ')||'—')+'</div>'
          +'<div><b>Team 2</b> '+esc(tm.b.join(', ')||'—')+'</div></div>';
      }
      if(ADMIN){
        h+='<button class="btn sm" onclick="oeffne(\''+d.id+'\')">'
          +(d.wdh?'Durchgang eintragen':(rd.length?'Ergebnis ändern':(d.modus==='gruppe'?'Teams und Ergebnis':'Ergebnis eintragen')))+'</button>'
          ;
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function klapp(id){ OFFEN[id]=!OFFEN[id]; rSpiele(); }
function wegRunde(rid){
  if(!confirm('Diesen Durchgang löschen?')) return;
  S.log=S.log.filter(r=>r.rid!==rid); save(); alles();
}

/* Eintragen */
function oeffne(id){
  if(!ADMIN){ alert('Nur der Spielleiter kann eintragen.'); return; }
  if(!S.spieler.length){ alert('Erst Spieler anlegen.'); return; }
  const d=S.disz.find(x=>x.id===id); if(!d) return;
  AUSWAHL=[]; TEILN=S.spieler.length; TEAM={}; GRUPPEN=null; GRANG=[];
  if(d.modus==='gruppe'){
    const tm=S.teams&&S.teams[d.id];
    S.spieler.forEach(sp=>TEAM[sp]=0);
    if(tm){ (tm.a||[]).forEach(x=>{ if(TEAM[x]!==undefined) TEAM[x]=1; });
            (tm.b||[]).forEach(x=>{ if(TEAM[x]!==undefined) TEAM[x]=2; }); }
  }
  MODUS = d.modus; CURD = d;
  let h='<div class="grip"></div><h3>'+esc(d.n)+'</h3>';
  if(d.modus==='gruppe'||d.modus==='paar'){
    h+='<div class="winrow" style="margin-bottom:10px">'
      +'<button class="btn sm'+(MODUS==='gruppe'?'':' ghost')+'" onclick="setModus(\''+d.id+'\',\'gruppe\')">Zwei Teams</button>'
      +'<button class="btn sm'+(MODUS==='paar'?'':' ghost')+'" onclick="setModus(\''+d.id+'\',\'paar\')">Mehrere Gruppen</button></div>';
  }
  h+=korpus(d);
  h+='<button class="btn ghost" onclick="zu()">Abbrechen</button>';
  document.getElementById('sheetin').innerHTML=h;
  if(MODUS==='rang'&&d.auto||MODUS==='paar') skalaTxt(d);
  picks(d);
  document.getElementById('sheet').classList.add('on');
}
function setModus(id,m){
  MODUS=m; AUSWAHL=[];
  const d=S.disz.find(x=>x.id===id);
  oeffneMitModus(d);
}
function oeffneMitModus(d){
  let h='<div class="grip"></div><h3>'+esc(d.n)+'</h3>'
    +'<div class="winrow" style="margin-bottom:10px">'
    +'<button class="btn sm'+(MODUS==='gruppe'?'':' ghost')+'" onclick="setModus(\''+d.id+'\',\'gruppe\')">Zwei Teams</button>'
    +'<button class="btn sm'+(MODUS==='paar'?'':' ghost')+'" onclick="setModus(\''+d.id+'\',\'paar\')">Mehrere Gruppen</button></div>'
    +korpus(d)+'<button class="btn ghost" onclick="zu()">Abbrechen</button>';
  document.getElementById('sheetin').innerHTML=h;
  if(MODUS==='paar') skalaTxt(d);
  picks(d);
}
function korpus(d){
  let h='';
  if(MODUS==='gruppe'){
    h+='<div class="hint">Tippe einen Namen an, um zwischen Team 1, Team 2 und nicht dabei zu wechseln. '
      +'Sieger bekommen '+d.win+', Verlierer '+d.lose+', wer nicht mitspielt bekommt nichts.</div>'
      +'<button class="btn" onclick="loseTeams(\''+d.id+'\')">Teams auslosen</button>'
      +'<div class="winrow"><button class="btn ghost sm" onclick="alleDabei(\''+d.id+'\')">Alle dabei</button>'
      +'<button class="btn ghost sm" onclick="restTeam2(\''+d.id+'\')">Rest in Team 2</button>'
      +'<button class="btn ghost sm" onclick="tauscheTeams(\''+d.id+'\')">Teams tauschen</button></div>'
      +'<div id="picks"></div>'
      +'<div class="winrow">'
      +'<button class="btn" onclick="teamSieg(\''+d.id+'\',1)">Team 1 gewinnt</button>'
      +'<button class="btn" onclick="teamSieg(\''+d.id+'\',2)">Team 2 gewinnt</button></div>'
      +'<button class="btn ghost" onclick="teamsMerken(\''+d.id+'\')">Nur Teams merken</button>';
  }else if(MODUS==='paar'){
    const g=d.gsize||2;
    h+='<label>Gruppengröße</label><input id="gs" type="number" min="2" max="8" value="'+g
      +'" oninput="setGsize(\''+d.id+'\')">';
    if(GRUPPEN){
      h+='<div class="hint">'+GRUPPEN.length+' Gruppen ausgelost. Tippe sie jetzt in der '
        +'Reihenfolge des Ergebnisses an, die Siegergruppe zuerst.</div>'
        +'<div class="hint" id="skalatxt"></div><div id="picks"></div>'
        +'<div class="winrow">'
        +'<button class="btn" onclick="speichern(\''+d.id+'\')">Speichern</button>'
        +'<button class="btn ghost" onclick="neuLosen(\''+d.id+'\')">Neu auslosen</button></div>';
    }else{
      h+='<div class="hint">Wer nicht mitspielt, wird nicht angetippt. Tippst du niemanden an, '
        +'sind alle dabei. Danach auslosen, dann werden die Gruppen zufällig gemischt.</div>'
        +'<div id="picks"></div>'
        +'<button class="btn" onclick="loseGruppen(\''+d.id+'\')">Gruppen auslosen</button>'
        +'<div class="hint" id="skalatxt" style="margin-top:10px"></div>'
        +'<button class="btn ghost" onclick="speichern(\''+d.id+'\')">Ohne Auslosen speichern</button>';
    }
  }else{
    if(d.auto){
      h+='<div class="hint">Wie viele machen mit? Die Punkte skalieren automatisch.</div>'

        +'" oninput="setTeiln(\''+d.id+'\')"><div class="hint" id="skalatxt"></div>';
    }else{
      h+='<div class="hint">Punkte: '+ptsVon(d).join(' / ')+'. In der Reihenfolge des Ergebnisses antippen.</div>';
    }
    h+='<div id="picks"></div><button class="btn" onclick="speichern(\''+d.id+'\')">Speichern</button>';
  }
  return h;
}
function losePool(id){
  const d=S.disz.find(x=>x.id===id); if(!d||!d.pool||!d.pool.length) return;
  const e=document.getElementById('pool_'+id); if(!e) return;
  e.innerHTML='<b style="color:var(--acc);font-size:15px">'
    +esc(d.pool[Math.floor(Math.random()*d.pool.length)])+'</b>';
}
function misch(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function alleDabei(id){
  S.spieler.forEach(sp=>TEAM[sp]=1); picks(S.disz.find(x=>x.id===id));
}
function loseTeams(id){
  const d=S.disz.find(x=>x.id===id);
  let dabei=S.spieler.filter(sp=>TEAM[sp]);
  if(dabei.length<2) dabei=S.spieler.slice();
  if(dabei.length<2){ alert('Dafür braucht es mindestens zwei Spieler.'); return; }
  const m=misch(dabei), h=Math.ceil(m.length/2);
  S.spieler.forEach(sp=>TEAM[sp]=0);
  m.forEach((sp,i)=>TEAM[sp]=i<h?1:2);
  picks(d);
}
function loseGruppen(id){
  const d=S.disz.find(x=>x.id===id), g=d.gsize||2;
  let dabei=AUSWAHL.length>=2?AUSWAHL.slice():S.spieler.slice();
  if(dabei.length<g*2){ alert('Für '+g+'er-Gruppen braucht es mindestens '+(g*2)+' Spieler.'); return; }
  const m=misch(dabei), anz=Math.floor(m.length/g);
  GRUPPEN=[];
  for(let i=0;i<anz;i++) GRUPPEN.push(m.slice(i*g,(i+1)*g));
  m.slice(anz*g).forEach(sp=>{ GRUPPEN[Math.floor(Math.random()*GRUPPEN.length)].push(sp); });
  GRANG=[]; AUSWAHL=[];
  oeffneMitModus(d);
}
function tippeGruppe(gi,id){
  const i=GRANG.indexOf(gi);
  if(i>=0) GRANG.splice(i,1); else GRANG.push(gi);
  picks(S.disz.find(x=>x.id===id));
}
function neuLosen(id){ GRUPPEN=null; GRANG=[]; AUSWAHL=[]; oeffneMitModus(S.disz.find(x=>x.id===id)); }
function tauscheTeams(id){
  S.spieler.forEach(sp=>{ if(TEAM[sp]===1) TEAM[sp]=2; else if(TEAM[sp]===2) TEAM[sp]=1; });
  picks(S.disz.find(x=>x.id===id));
}
function setGsize(id){
  const d=S.disz.find(x=>x.id===id);
  d.gsize=Math.max(2,parseInt(document.getElementById('gs').value,10)||2);
  skalaTxt(d); picks(d);
}
function restTeam2(id){
  S.spieler.forEach(sp=>{ if(!TEAM[sp]) TEAM[sp]=2; });
  picks(S.disz.find(x=>x.id===id));
}
function teamsMerken(id){
  if(!S.teams) S.teams={};
  S.teams[id]={a:S.spieler.filter(x=>TEAM[x]===1), b:S.spieler.filter(x=>TEAM[x]===2)};
  save(); zu(); alles();
}
function teamSieg(id,sieger){
  const d=S.disz.find(x=>x.id===id);
  const a=S.spieler.filter(x=>TEAM[x]===1), b=S.spieler.filter(x=>TEAM[x]===2);
  if(!a.length||!b.length){ alert('Beide Teams brauchen mindestens einen Spieler.'); return; }
  if(!S.teams) S.teams={};
  S.teams[id]={a:a,b:b};
  const p={};
  a.forEach(x=>p[x]=(sieger===1?d.win:d.lose));
  b.forEach(x=>p[x]=(sieger===2?d.win:d.lose));
  if(!d.wdh) S.log=S.log.filter(r=>r.d!==id);
  S.log.push({rid:'r'+Date.now()+Math.random().toString(36).slice(2,6),d:id,ts:Date.now(),p:p});
  save(); zu(); alles();
}
function setTeiln(id){
  const d=S.disz.find(x=>x.id===id);
  TEILN=Math.max(2,parseInt(document.getElementById('tn').value,10)||2);
  if(AUSWAHL.length>TEILN) AUSWAHL=AUSWAHL.slice(0,TEILN);
  skalaTxt(d); picks(d);
}
function skalaTxt(d){
  const e=document.getElementById('skalatxt'); if(!e) return;
  if(MODUS==='paar'&&GRUPPEN){
    e.textContent='Punkte je Gruppe: '+ptsVon(d,GRUPPEN.length).join(' / ');
    return;
  }
  if(MODUS==='paar'){
    const g=d.gsize||2, anz=Math.max(2, Math.ceil(AUSWAHL.length/g)||2);
    e.textContent = AUSWAHL.length
      ? Math.ceil(AUSWAHL.length/g)+' Gruppen bisher, Punkte je Gruppe: '+ptsVon(d,anz).join(' / ')
      : 'Punkte werden nach Anzahl der Gruppen verteilt.';
  }else{
    e.textContent='Verteilt wird: '+ptsVon(d,TEILN).join(' / ');
  }
}
function picks(d){
  let h='';
  if(MODUS==='gruppe'){
    S.spieler.forEach(sp=>{
      const t=TEAM[sp]||0;
      h+='<div class="pick'+(t?' t'+t:'')+'" onclick="zykel(\''+esc(sp).replace(/'/g,'')+'\',\''+d.id+'\')">'
        +'<div class="num">'+(t?t:'&middot;')+'</div><div class="nm">'+esc(sp)+'</div>'
        +'<div class="gain">'+(t?'Team '+t:'nicht dabei')+'</div></div>';
    });
  }else if(MODUS==='paar'&&GRUPPEN){
    const p=ptsVon(d,GRUPPEN.length);
    GRUPPEN.forEach((gr,gi)=>{
      const i=GRANG.indexOf(gi), sel=i>=0;
      h+='<div class="pick'+(sel?' sel':'')+'" onclick="tippeGruppe('+gi+',\''+d.id+'\')">'
        +'<div class="num">'+(sel?i+1:'&middot;')+'</div>'
        +'<div class="nm">'+gr.map(esc).join(', ')+'</div>'
        +'<div class="gain">'+(sel&&p[i]!==undefined?'+'+p[i]:'')+'</div></div>';
    });
  }else if(MODUS==='paar'){
    const g=d.gsize||2, anz=Math.max(2, Math.ceil(AUSWAHL.length/g)||2), p=ptsVon(d,anz);
    S.spieler.forEach(sp=>{
      const i=AUSWAHL.indexOf(sp), sel=i>=0, gr=sel?Math.floor(i/g):-1;
      h+='<div class="pick'+(sel?' sel':'')+'" onclick="tippe(\''+esc(sp).replace(/'/g,'')+'\',\''+d.id+'\')">'
        +'<div class="num">'+(sel?gr+1:'&middot;')+'</div><div class="nm">'+esc(sp)+'</div>'
        +'<div class="gain">'+(sel&&p[gr]!==undefined?'+'+p[gr]:'')+'</div></div>';
    });
  }else{
    const p=ptsVon(d,TEILN);
    S.spieler.forEach(sp=>{
      const i=AUSWAHL.indexOf(sp), sel=i>=0;
      h+='<div class="pick'+(sel?' sel':'')+'" onclick="tippe(\''+esc(sp).replace(/'/g,'')+'\',\''+d.id+'\')">'
        +'<div class="num">'+(sel?i+1:'&middot;')+'</div><div class="nm">'+esc(sp)+'</div>'
        +'<div class="gain">'+(sel&&p[i]!==undefined?'+'+p[i]:'')+'</div></div>';
    });
  }
  document.getElementById('picks').innerHTML=h;
}
function zykel(name,id){
  TEAM[name]=((TEAM[name]||0)+1)%3;
  picks(S.disz.find(x=>x.id===id));
}
function tippe(name,id){
  const d=S.disz.find(x=>x.id===id), i=AUSWAHL.indexOf(name);
  if(i>=0) AUSWAHL.splice(i,1);
  else{
    if(MODUS==='rang'&&AUSWAHL.length>=ptsVon(d,TEILN).length) return;
    AUSWAHL.push(name);
  }
  if(MODUS==='paar') skalaTxt(d);
  picks(d);
}
function speichern(id){
  const d=S.disz.find(x=>x.id===id);
  if(!AUSWAHL.length && !(MODUS==='paar'&&GRUPPEN)){ alert('Niemand ausgewählt.'); return; }
  const p={};
  if(MODUS==='paar'&&GRUPPEN){
    if(GRANG.length<GRUPPEN.length){ alert('Bitte alle '+GRUPPEN.length+' Gruppen in der Reihenfolge antippen.'); return; }
    const sk=ptsVon(d,GRUPPEN.length);
    GRANG.forEach((gi,rang)=>{ GRUPPEN[gi].forEach(sp=>{ if(sk[rang]!==undefined) p[sp]=sk[rang]; }); });
  }else if(MODUS==='paar'){
    const g=d.gsize||2, anz=Math.max(2, Math.ceil(AUSWAHL.length/g));
    if(AUSWAHL.length%g!==0 && !confirm('Die letzte Gruppe ist unvollständig. Trotzdem speichern?')) return;
    const sk=ptsVon(d,anz);
    AUSWAHL.forEach((sp,i)=>{ const gr=Math.floor(i/g); if(sk[gr]!==undefined) p[sp]=sk[gr]; });
  }else{
    const sk=ptsVon(d,TEILN);
    AUSWAHL.forEach((sp,i)=>{ if(sk[i]!==undefined) p[sp]=sk[i]; });
  }
  if(!d.wdh) S.log=S.log.filter(r=>r.d!==id);
  S.log.push({rid:'r'+Date.now()+Math.random().toString(36).slice(2,6),d:id,ts:Date.now(),p:p});
  save(); zu(); alles();
}
function zu(){ document.getElementById('sheet').classList.remove('on'); }

/* Setup */
function rSetup(){
  const el=document.getElementById('setup');
  if(!ADMIN){ el.innerHTML=''; return; }
  let h='<div class="card"><h2>Spieler</h2>';
  S.spieler.forEach((s,i)=>h+='<div class="pick"><div class="nm">'+esc(s)+'</div>'
    +'<button class="gain" onclick="wegSp('+i+')">&times;</button></div>');
  h+='<input id="neu" placeholder="Name" onkeydown="if(event.key===\'Enter\')addSp()">'
    +'<button class="btn" onclick="addSp()">Spieler hinzufügen</button></div>';
  h+='<div class="card"><h2>Disziplin anlegen oder ändern</h2>'
    +'<label>Name</label><input id="dn" placeholder="z. B. Sackhüpfen">'
    +'<label>Beschreibung</label><textarea id="dbx" rows="4"></textarea>'
    +'<label>Material</label><input id="dm" placeholder="Was wird gebraucht?">'
    +'<label>Kategorie</label><select id="dk">'
    +KAT.k.map(([k,t])=>'<option value="'+k+'">'+t+'</option>').join('')+'</select>'
    +'<label>Wertung</label><select id="dmod" onchange="modWechsel()">'
    +'<option value="gruppe">Gruppe: Sieger antippen, Rest bekommt Verliererpunkte</option>'
    +'<option value="rang">Rang: in Reihenfolge antippen</option>'
    +'<option value="paar">Gruppen: je zwei oder drei bilden eine Gruppe</option></select>'
    +'<div id="cfg"></div>'
    +'<label><input type="checkbox" id="dwdh" style="width:auto;margin-right:8px"> Mehrfach spielbar</label>'
    +'<button class="btn" onclick="addDisz()">Disziplin speichern</button>'
    +'<button class="btn ghost" onclick="neuDisz()">Formular leeren</button></div>';
  h+='<div class="card"><h2>Disziplinen verwalten</h2>';
  S.disz.forEach((d,i)=>h+='<div class="pick"><div class="nm">'+esc(d.n)+'</div>'
    +'<button class="gain" onclick="editDisz('+i+')">bearb.</button>'
    +'<button class="gain" onclick="wegDisz('+i+')">&times;</button></div>');
  h+='</div><div class="card"><h2>Zurücksetzen</h2>'
    +'<div class="hint">Ergebnisse löschen behält Spieler und Disziplinen.</div>'
    +'<button class="btn warn" onclick="resErg()">Ergebnisse löschen</button>'
    +'<button class="btn warn" onclick="resAll()">Alles zurücksetzen</button></div>';
  el.innerHTML=h; modWechsel();
}
function modWechsel(){
  const s=document.getElementById('dmod'); if(!s) return;
  if(s.value==='paar'){
    document.getElementById('cfg').innerHTML =
      '<label>Gruppengröße</label><input id="pg" type="number" min="2" max="6" value="2">'
      +'<label>Faktor</label><input id="pf" type="number" step="0.5" min="0.5" value="1">';
    return;
  }
  document.getElementById('cfg').innerHTML = s.value==='gruppe'
    ? '<label>Punkte Sieger</label><input id="pw" type="number" value="10">'
      +'<label>Punkte Verlierer</label><input id="pl" type="number" value="5">'
    : '<label><input type="checkbox" id="pauto" checked onchange="autoWechsel()" '
      +'style="width:auto;margin-right:8px"> Punkte automatisch aus Teilnehmerzahl</label>'
      +'<div id="pfix" style="display:none"><label>Feste Punkte, mit Komma getrennt</label>'
      +'<input id="pp" value="3, 2, 1"></div>'
      +'<label>Faktor</label><input id="pf" type="number" step="0.5" min="0.5" value="1">';
}
function autoWechsel(){
  const c=document.getElementById('pauto'), f=document.getElementById('pfix');
  if(c&&f) f.style.display=c.checked?'none':'';
}
function neuDisz(){ BEARB=null; rSetup(); }
function editDisz(i){
  const d=S.disz[i]; BEARB=d.id;
  document.getElementById('dn').value=d.n;
  document.getElementById('dbx').value=d.b||'';
  document.getElementById('dm').value=d.m||'';
  document.getElementById('dk').value=d.kat||'einzel';
  document.getElementById('dmod').value=d.modus; modWechsel();
  document.getElementById('dwdh').checked=!!d.wdh;
  if(d.modus==='gruppe'){
    document.getElementById('pw').value=d.win; document.getElementById('pl').value=d.lose;
  }else{
    document.getElementById('pauto').checked=!!d.auto; autoWechsel();
    document.getElementById('pp').value=(d.pts||[3]).join(', ');
    document.getElementById('pf').value=d.faktor||1;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function addDisz(){
  const n=document.getElementById('dn').value.trim();
  if(!n){ alert('Name fehlt.'); return; }
  const modus=document.getElementById('dmod').value;
  const d={id:BEARB||('x'+Date.now()), n:n, modus:modus,
    kat:document.getElementById('dk').value,
    b:document.getElementById('dbx').value.trim(),
    m:document.getElementById('dm').value.trim(),
    wdh:document.getElementById('dwdh').checked, auto:false, faktor:1, pts:[], eigen:true};
  if(modus==='paar'){
    d.gsize=parseInt(document.getElementById('pg').value,10)||2;
    d.faktor=parseFloat(document.getElementById('pf').value)||1;
    d.auto=true;
  }else if(modus==='gruppe'){
    d.win=parseInt(document.getElementById('pw').value,10)||0;
    d.lose=parseInt(document.getElementById('pl').value,10)||0;
  }else{
    d.auto=document.getElementById('pauto').checked;
    d.faktor=parseFloat(document.getElementById('pf').value)||1;
    d.pts=document.getElementById('pp').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));
    if(!d.auto&&!d.pts.length) d.pts=[3];
  }
  const i=S.disz.findIndex(x=>x.id===d.id);
  if(i>=0) S.disz[i]=d; else S.disz.push(d);
  BEARB=null; save(); alles(); alert('"'+n+'" gespeichert.');
}
function wegDisz(i){
  if(!confirm('"'+S.disz[i].n+'" löschen?')) return;
  const id=S.disz[i].id; S.log=S.log.filter(r=>r.d!==id); S.disz.splice(i,1); save(); alles();
}
function addSp(){
  const i=document.getElementById('neu'), v=i.value.trim(); if(!v) return;
  if(S.spieler.includes(v)){ alert('Name gibt es schon.'); return; }
  S.spieler.push(v); save(); alles();
  const n=document.getElementById('neu'); if(n) n.focus();
}
function wegSp(i){
  if(!confirm('"'+S.spieler[i]+'" entfernen?')) return;
  const n=S.spieler[i]; S.spieler.splice(i,1);
  S.log.forEach(r=>{ delete r.p[n]; }); save(); alles();
}
function resErg(){ if(confirm('Alle Ergebnisse löschen?')){ S.log=[]; save(); alles(); } }
function resAll(){ if(confirm('Wirklich alles zurücksetzen?')){ S=leer(); save(); alles(); } }

/* Teilen */
function teilen(){
  const t=tabelle(); let x='ZWISCHENSTAND OLYMPIADE\n\n';
  t.forEach((r,i)=>x+=(i+1)+'. '+r.n+' — '+r.p+'\n');
  x+='\n'+S.log.length+' Durchgänge gespielt';
  if(navigator.share) navigator.share({text:x}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(x).then(()=>alert('Kopiert.'));
  else prompt('Kopieren:',x);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rRegeln(){
  const el=document.getElementById('regeln'); if(!el) return;
  const n=S.spieler.length||0;
  const ez=S.disz.find(d=>d.id==='strumpf'), qz=S.disz.find(d=>d.id==='quiz');
  const zeile=a=>a.length?a.join(' &middot; '):'wird nach Teilnehmerzahl berechnet';
  const anzahl=k=>S.disz.filter(d=>d.kat===k).length;
  const tm=S.disz.find(d=>d.modus==='gruppe')||{win:10,lose:5};
  el.innerHTML=
   '<div class="card"><div class="dname">Wer mitmacht, bekommt Punkte</div>'
   +'<div class="hint">Auch der Letzte einer Disziplin bekommt noch etwas. Nur wer gar nicht '
   +'antritt, bekommt nichts. Der Erste bekommt zwei Bonuspunkte obendrauf, der Zweite einen.</div></div>'

   +'<div class="card"><div class="dname">Was welche Disziplin wert ist</div><div class="hint">'
   +'<b>Einzelspiele</b> ('+anzahl('einzel')+'): '+(n?zeile(ptsVon(ez||{auto:1},n)):'nach Teilnehmerzahl')+'<br>'
   +'<span class="hint">Am höchsten bewertet, weil du dich gegen alle durchsetzen musst.</span><br><br>'
   +'<b>Partnerspiele</b> ('+anzahl('partner')+'): nach Anzahl der Paare, beide Partner gleich viel.<br><br>'
   +'<b>Teamspiele</b> ('+anzahl('team')+'): Gewinnerteam je '+(tm.win||8)
   +', Verliererteam je '+(tm.lose||4)+'. Niedriger als Einzelspiele, weil ein Teamsieg '
   +'näher am Münzwurf liegt.<br><br>'
   +'<b>Minispiele</b> ('+anzahl('mini')+'): Sieger 3, Verlierer 0.<br><br>'
   +'<b>Schätzfragen</b>: 3 &middot; 2 &middot; 1.'
   +'</div></div>'

   +'<div class="card"><div class="dname">Warum so gestaffelt</div>'
   +'<div class="hint">Je unwahrscheinlicher der Sieg, desto mehr ist er wert. '
   +'In einer Einzeldisziplin setzt du dich gegen alle durch, im Team gewinnst du im Grunde '
   +'eine Münze, im Duell steht es eins zu eins. Deshalb sind Einzelspiele die '
   +'Spielentscheider und Minispiele die Würze.</div></div>'

   +'<div class="card"><div class="dname">Die Minispiel-Karten</div>'
   +'<div class="hint">Jeder bekommt zwei Karten zugelost. Du suchst dir das Spiel also '
   +'nicht aus, sondern nur den Gegner, und der kann nicht ablehnen. Darin liegt die '
   +'Taktik: Fordere jemanden, dem dein Spiel nicht liegt.<br><br>'
   +'Jede Person darfst du nur einmal fordern, auch mit der zweiten Karte. '
   +'Wer gewinnt, bekommt drei Punkte, wer verliert, nichts. Herausgefordert zu werden '
   +'ist damit ein Geschenk, denn du riskierst keine eigene Karte.<br><br>'
   +'Eine dritte Person entscheidet bei Streit. Bis zur Siegerehrung am Sonntag '
   +'einlösen, danach verfallen die Karten.</div></div>'

   +'<div class="card"><div class="dname">Die Schätzfragen</div>'
   +'<div class="hint">Jeder bekommt per Direktnachricht eine Nummer und ruft damit seine '
   +'eigenen Fragen ab. Die stellst du der Runde, alle anderen schätzen verdeckt, dann löst '
   +'du auf. Bei den eigenen Fragen rätst du nicht mit. Niemandem zeigen, auch nicht '
   +'untereinander.</div></div>'

   +'<div class="card"><div class="dname">Gleichstand am Ende</div>'
   +'<div class="hint">Schere, Stein, Papier auf drei Gewinnspiele. Bei mehr als zwei '
   +'Beteiligten wird die ganze Gruppe in einem Durchgang aufgelöst, der Sieger bekommt '
   +'den größten Bonus. Am Sonntagabend gibt es Urkunden und für die vorderen Plätze '
   +'ein Freigetränk.</div></div>'

   +'<div class="card"><div class="dname">Was du nicht musst</div>'
   +'<div class="hint">Nichts vorbereiten, nichts mitbringen, nicht fit sein. Keine Disziplin '
   +'ist Pflicht. Der Spielleiter führt Protokoll und entscheidet bei Streitfällen.</div></div>';
}
function alles(){ rTab(); rSpiele(); rRegeln(); rSetup(); }


document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['tab','spiele','regeln','setup'].forEach(id=>
    document.getElementById(id).style.display=(id===b.dataset.t)?'':'none');
  window.scrollTo({top:0});
});
document.getElementById('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') zu(); });
if(!ADMIN){ const t=document.getElementById('tabsetup'); if(t) t.style.display='none'; }
alles(); verbinde();
</script>
</body>
</html>
