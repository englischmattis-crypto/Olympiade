<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>Jonas-Olympiade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --gold:#e0b64a; --gold2:#f0d38a; --ink:#f6f2ea; --muted:#9d9284;
  --card:rgba(20,17,14,.62); --line:rgba(224,182,74,.30); --ok:#7bbf6a; --warn:#e08a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;color:var(--ink);background:#12100e;position:relative;overflow-x:hidden;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 16px calc(40px + env(safe-area-inset-bottom));
}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:url("background.jpg") center 16% / cover no-repeat;filter:saturate(.9) contrast(1.02)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(16,14,12,.34)}
.wrap{max-width:560px;margin:0 auto;padding-top:calc(30px + env(safe-area-inset-top))}

/* Kopf */
.crest{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;background:rgba(18,16,14,.5);
  box-shadow:0 2px 20px rgba(0,0,0,.6);font-size:26px}
h1{font-size:23px;letter-spacing:.22em;text-transform:uppercase;margin:0;text-align:center;
   font-weight:800;text-shadow:0 2px 16px rgba(0,0,0,.9)}
.sub{text-align:center;color:var(--gold);font-size:10.5px;letter-spacing:.2em;
     text-transform:uppercase;margin:8px 0 0;opacity:.9;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.status{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#b5aa98;margin:14px 0 20px;
  text-shadow:0 1px 10px rgba(0,0,0,.9)}
.sdot{width:7px;height:7px;border-radius:50%;background:#b5aa98}
.sdot.live{background:var(--ok)}.sdot.off{background:var(--warn)}

/* Tabs */
.tabs{display:flex;gap:7px;margin-bottom:16px}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid var(--line);border-radius:12px;
  background:rgba(20,17,14,.55);color:#b5aa98;cursor:pointer}
.tab.on{background:var(--gold);color:#1b1710;border-color:var(--gold)}

/* Karten */
.card{background:var(--card);backdrop-filter:blur(14px) saturate(.8);
  -webkit-backdrop-filter:blur(14px) saturate(.8);border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
   margin:0 0 14px;font-weight:700}

/* Podium */
.pod{display:flex;gap:8px;margin-bottom:14px}
.pcol{flex:1;text-align:center;border-radius:14px;padding:14px 6px 12px;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
.pcol.p1{background:linear-gradient(180deg,rgba(224,182,74,.26),rgba(224,182,74,.06));
  border-color:rgba(224,182,74,.6)}
.pmed{font-size:20px;line-height:1}
.pnm{font-size:13.5px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppt{font-size:19px;font-weight:800;color:var(--gold);margin-top:2px}

/* Rangliste */
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(224,182,74,.12)}
.rank:last-child{border-bottom:0}
.pos{width:24px;font-size:14px;font-weight:800;color:#8d8375;text-align:center;flex:none}
.nm{flex:1;font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{font-size:17px;font-weight:800;color:var(--gold);flex:none}

/* Fortschritt */
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--gold)}
.hint{font-size:12.5px;color:#b5aa98;line-height:1.6}

/* Disziplinen */
.disz{border-bottom:1px solid rgba(224,182,74,.12);padding:13px 0}
.disz:last-child{border-bottom:0}
.dhead{display:flex;align-items:center;gap:11px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:#8d8375;flex:none}
.dot.done{background:var(--ok)}
.dinfo{flex:1;min-width:0}
.dname{font-size:15.5px;font-weight:600}
.dmeta{font-size:11px;color:#9d9284;margin-top:2px;letter-spacing:.04em}
.chev{color:#8d8375;font-size:13px;flex:none;transition:transform .2s}
.disz.open .chev{transform:rotate(90deg)}
.dbody{display:none;padding:12px 0 4px 20px}
.disz.open .dbody{display:block}
.dtext{font-size:13.5px;color:#cfc6b6;line-height:1.65}
.dmat{font-size:12px;color:#9d9284;margin-top:8px;font-style:italic}

/* Buttons */
button{font:inherit;border:0;cursor:pointer}
.btn{width:100%;padding:14px;font-size:14.5px;font-weight:700;letter-spacing:.05em;
  border-radius:12px;background:var(--gold);color:#1b1710;margin-top:8px}
.btn.ghost{background:transparent;color:var(--gold);border:1px dashed var(--line)}
.btn.warn{background:transparent;color:#ff9d8a;border:1px dashed rgba(255,157,138,.4)}
.btn.sm{padding:10px;font-size:13px;margin-top:6px}

input,select,textarea{width:100%;padding:12px;font-size:15px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.06);color:var(--ink);margin-bottom:8px;
  font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
select option{background:#171412;color:var(--ink)}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:#9d9284;margin:10px 0 6px}

/* Auswahl */
.pick{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer}
.pick.sel{background:rgba(224,182,74,.18);border-color:var(--gold)}
.pick .num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);
  color:#9d9284;font-size:12.5px;font-weight:800;display:flex;align-items:center;
  justify-content:center;flex:none}
.pick.sel .num{background:var(--gold);color:#1b1710}
.pick .gain{font-size:13px;font-weight:800;color:var(--gold);flex:none}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,9,8,.75);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheetin{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:#171412;
  border:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.sheetin h3{margin:0 0 6px;font-size:19px}
.grip{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.settle{font-size:13.5px;line-height:1.95;color:#b5aa98}
.settle b{color:var(--ink)}
.empty{text-align:center;color:#9d9284;font-size:14px;padding:22px 0}
.ro{background:rgba(224,182,74,.12);border:1px solid var(--line);border-radius:12px;
  padding:11px;font-size:12.5px;text-align:center;margin-bottom:12px}
.lnk{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.runden{margin:12px 0 4px;border-top:1px dashed rgba(224,182,74,.2);padding-top:10px}
.rd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;color:#b5aa98;padding:5px 0}
.rdx{background:transparent;color:#ff9d8a;font-size:17px;line-height:1;padding:0 4px}
.teams{margin:10px 0 2px;font-size:12.5px;color:#b5aa98;line-height:1.9}
.teams b{color:var(--gold);letter-spacing:.06em;margin-right:6px}
.pick.t1{background:rgba(224,182,74,.18);border-color:var(--gold)}
.pick.t2{background:rgba(123,191,106,.16);border-color:rgba(123,191,106,.6)}
.pick.t1 .num{background:var(--gold);color:#1b1710}
.pick.t2 .num{background:#7bbf6a;color:#12200e}
.winrow{display:flex;gap:8px;margin-top:6px}
.winrow .btn{margin-top:0}
.lnk{display:block;text-align:center;text-decoration:none;box-sizing:border-box;line-height:1.3}
textarea{resize:vertical}
.foot{text-align:center;color:#9d9284;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  margin-top:26px;opacity:.55;text-shadow:0 1px 10px rgba(0,0,0,.9)}
</style>
</head>

<script>

const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqeWR0ZGhycWJoaWNuaXVucm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MTMyNjEsImV4cCI6MjEwMjE4OTI2MX0.mGTd0coZJp01EgI1genIPMQ0OvFNKC7YxtktBDIXEoM';
const ROW='jga2026', KEY='jga_olymp_v3';
const ADMIN=new URLSearchParams(location.search).has('admin');
const KAT={"d":[{"id":"flunky","n":"Flunkyball","kat":"team","modus":"gruppe","win":10,"lose":5,"b":"Zwei Teams stehen sich in zwei Reihen gegenüber, in der Mitte steht eine leere Flasche. Ein Team wirft mit einem Wurfgegenstand auf die Flasche. Fällt sie um, trinken alle aus dem werfenden Team, bis das gegnerische Team die Flasche wieder aufgestellt und den Werfer zurückgeholt hat. Das Team, das zuerst ausgetrunken hat, gewinnt.","m":"Wurfgegenstand, leere Flasche, Getränke in Dosen","link":"","auto":false,"wdh":false,"faktor":1},{"id":"ttt","n":"Schubkarren-Tic-Tac-Toe","kat":"team","modus":"gruppe","win":10,"lose":5,"b":"Ein Spielfeld mit neun Feldern wird auf den Boden geklebt. Jedes Team bekommt drei Tücher in seiner Farbe. Zwei Personen bilden ein Gespann, eine ist die Schubkarre, eine schiebt. Auf Los geht es zum Feld, ein Tuch wird abgelegt, zurück werden die Rollen getauscht, dann startet das nächste Paar. Liegen alle drei Tücher, dürfen sie im Feld verschoben werden. Wer drei in einer Reihe hat, gewinnt.","m":"Klebeband, sechs Tücher in zwei Farben","link":"","auto":false,"wdh":false,"faktor":1},{"id":"beerpong","n":"Beerpong","kat":"team","modus":"gruppe","win":10,"lose":5,"b":"Zwei Teams stehen sich an einem Tisch gegenüber, vor jedem stehen Becher in Dreiecksform. Abwechselnd wird versucht, einen Tischtennisball in einen gegnerischen Becher zu werfen. Wer getroffen wird, trinkt den Becher aus und stellt ihn beiseite. Das Team, das zuerst alle gegnerischen Becher trifft, gewinnt.","m":"Becher, Tischtennisbälle, Getränke","link":"","auto":false,"wdh":false,"faktor":1},{"id":"kubb","n":"Kubb","kat":"team","modus":"gruppe","win":10,"lose":5,"b":"Zwei Teams werfen abwechselnd mit Wurfhölzern. Erst müssen alle Holzklötze der Gegenseite umgeworfen werden, danach der König in der Feldmitte. Wer den König zu früh trifft, hat sofort verloren. Braucht etwa acht mal zwölf Meter freie Fläche.","m":"Kubb-Set","link":"","auto":false,"wdh":false,"faktor":1},{"id":"boule","n":"Boule","kat":"team","modus":"gruppe","win":10,"lose":5,"b":"Zuerst wird die kleine Zielkugel geworfen. Dann versuchen beide Teams abwechselnd, ihre Kugeln möglichst nah daran zu platzieren. Punkte bekommt das Team, dessen Kugel am nächsten liegt, und zwar für jede eigene Kugel, die näher liegt als die beste des Gegners. Gespielt wird meist in Zweier- oder Dreierteams.","m":"Boule-Set mit Zielkugel","link":"","auto":false,"wdh":false,"faktor":1},{"id":"turm","n":"Turmbau-Challenge","kat":"team","modus":"gruppe","win":10,"lose":5,"b":"Beide Teams bekommen gleich viel Material und dieselbe Zeit, meist zehn Minuten. Gebaut wird ein möglichst hoher und stabiler Turm, auf dessen Spitze ein Apfel Platz haben muss. Nach Ablauf der Zeit wird der Apfel aufgelegt, der Turm muss eine Minute frei stehen bleiben.","m":"Papier, Klebeband, Becher, ein Apfel","link":"","auto":false,"wdh":false,"faktor":1},{"id":"ballon","n":"Ballon zwischen den Körpern","kat":"partner","modus":"rang","auto":true,"b":"Zweierteams klemmen einen Luftballon zwischen ihre Körper und laufen damit eine Strecke und zurück, ohne ihn mit den Händen zu berühren. Fällt der Ballon zu Boden, wird an dieser Stelle neu gestartet. Das schnellste Team gewinnt. Beide Partner bekommen dieselbe Platzierung, also direkt nacheinander antippen.","m":"Luftballons","link":"","wdh":false,"faktor":1,"pts":[]},{"id":"strumpf","n":"Strumpf-Abrissbirne","kat":"einzel","modus":"rang","auto":true,"b":"Leere Flaschen werden in einer Reihe aufgestellt. Ein Ball kommt in eine Strumpfhose, die über den Kopf gezogen wird, sodass der Ball vorn herunterhängt. Ohne Hände müssen nun alle Flaschen umgeworfen werden. Die Zeit wird gestoppt, wer am schnellsten ist, gewinnt.","m":"Strumpfhose, Tennisball, sechs bis acht leere Flaschen","link":"","wdh":false,"faktor":1,"pts":[]},{"id":"stampf","n":"Luftballon stampfen","kat":"einzel","modus":"rang","auto":true,"b":"Jede Person bekommt zwei Luftballons mit Klebeband an die Knöchel. Auf Los versuchen alle gleichzeitig, die Ballons der anderen zu zertreten und die eigenen zu behalten. Wer beide Ballons verliert, scheidet aus. Wer zuletzt übrig bleibt, gewinnt. Beim Eintragen mit dem Sieger beginnen und dann rückwärts durch die Ausscheidungsreihenfolge gehen.","m":"Luftballons, Klebeband","link":"","wdh":false,"faktor":1,"pts":[]},{"id":"quiz","n":"Jonas-Quiz","kat":"einzel","modus":"rang","auto":true,"faktor":2,"b":"Fragen über die Person, die gefeiert wird. Wer sie am besten kennt, gewinnt. Die Fragen sollte jemand vorbereiten, der selbst nicht mitspielt, sonst hat der Fragesteller einen unfairen Vorteil.","m":"Vorbereitete Fragen","link":"","wdh":false,"pts":[]},{"id":"dart","n":"Dart-Duell","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Jede Person wirft drei Darts, gezählt wird die erreichte Punktzahl. Wer am meisten trifft, gewinnt.","m":"Dartscheibe","link":"","auto":false,"faktor":1},{"id":"flieger","n":"Papierflieger-Weitwurf","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Jeder faltet einen Flieger und hat drei Versuche. Die weiteste Distanz zählt.","m":"Papier","link":"","auto":false,"faktor":1},{"id":"teebeutel","n":"Teebeutel-Golf","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Einen Teebeutel am Faden in einen Becher werfen. Drei Versuche, wer öfter trifft, gewinnt.","m":"Teebeutel, Becher","link":"","auto":false,"faktor":1},{"id":"keks","n":"Keks ohne Hände","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Ein Keks liegt auf der Stirn und muss nur mit den Gesichtsmuskeln in den Mund bewegt werden. Ohne Hände.","m":"Kekse","link":"","auto":false,"faktor":1},{"id":"zeit","n":"Zeitgefühl","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Eine Stoppuhr mit abgeklebtem Display. Starten und bei gefühlt genau zwei Minuten stoppen. Zwei Versuche, der bessere zählt. Wer am nächsten an 2:00 liegt, gewinnt.","m":"Handy mit abgeklebtem Display","link":"","auto":false,"faktor":1},{"id":"bierdeckel","n":"Bierdeckel-Weitwurf","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Drei Würfe pro Person, die weiteste Distanz zählt. Klingt banal, ist erstaunlich schwer.","m":"Bierdeckel","link":"","auto":false,"faktor":1},{"id":"dosen","n":"Dosen-Sniper","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Eine Pyramide aus leeren Dosen, ein Wurf pro Person. Wer mehr Dosen abräumt, gewinnt.","m":"Leere Dosen","link":"","auto":false,"faktor":1},{"id":"banane","n":"Banane teilen","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Eine Banane mit den Händen möglichst genau in der Mitte durchbrechen. Wer näher an der Hälfte liegt, gewinnt.","m":"Bananen","link":"","auto":false,"faktor":1},{"id":"ballonduell","n":"Luftballon-Duell","kat":"mini","modus":"rang","pts":[3],"wdh":true,"b":"Einen Luftballon mit nur einer Hand in der Luft halten, die andere bleibt hinter dem Rücken. Wer ihn zuerst fallen lässt, verliert.","m":"Luftballons","link":"","auto":false,"faktor":1},{"id":"schaetz","n":"Schätzfrage","kat":"schaetz","modus":"rang","pts":[3,2,1],"wdh":true,"link":"fragen/","b":"Eine Frage mit einer Zahl als Antwort wird vorgelesen. Der Fragesteller rät nicht mit. Alle anderen schreiben ihre Schätzung verdeckt auf, danach wird aufgelöst. Wer am nächsten dran liegt, bekommt die meisten Punkte.","m":"Zettel und Stifte","auto":false,"faktor":1}],"k":[["team","Teamspiele"],["partner","Partnerspiele"],["einzel","Einzeldisziplinen"],["mini","Minispiele"],["schaetz","Schätzfragen"]]};
let db=null, live=false, dirty=false, AUSWAHL=[], OFFEN={}, TEILN=0, BEARB=null, TEAM={};

function leer(){ return {spieler:[], disz:JSON.parse(JSON.stringify(KAT.d)), log:[], teams:{}, stand:0}; }
let S=(function(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return leer(); })();

/* Punkteskala automatisch aus Teilnehmerzahl */
function skala(n, faktor){
  const a=[];
  for(let i=0;i<n;i++){
    let p=n-i;
    if(i===0) p+=2; else if(i===1) p+=1;
    a.push(p*(faktor||1));
  }
  return a;
}
function ptsVon(d,n){
  if(d.modus!=='rang') return [];
  if(d.auto) return skala(n||S.spieler.length, d.faktor);
  return (d.pts||[]).map(x=>x*(d.faktor||1));
}
function regeltext(d){
  if(d.modus==='gruppe') return 'Sieger '+d.win+', Verlierer '+d.lose;
  if(d.auto) return 'Rang, Punkte je nach Teilnehmerzahl'+(d.faktor>1?' (x'+d.faktor+')':'');
  return 'Rang '+ptsVon(d).join(' / ');
}
function runden(id){ return S.log.filter(r=>r.d===id); }

function punkte(){
  const p={}; S.spieler.forEach(s=>p[s]=0);
  S.log.forEach(r=>Object.keys(r.p).forEach(s=>{ if(p[s]!==undefined) p[s]+=r.p[s]; }));
  return p;
}
function tabelle(){
  const p=punkte();
  return S.spieler.map(s=>({n:s,p:p[s]})).sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n));
}

/* Speichern und Sync */
function save(){ S.stand=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} push(); }
function stat(t,c){ const d=document.getElementById('sdot'),x=document.getElementById('stxt');
  if(!d)return; d.className='sdot'+(c?' '+c:''); x.textContent=t; }
async function push(){
  if(!db||!ADMIN) return;
  try{ const {error}=await db.from('olympiade').upsert({id:ROW,data:S,updated_at:new Date().toISOString()});
    if(error) throw error; dirty=false; stat('gespeichert','live');
    setTimeout(()=>{ if(!dirty) stat(live?'live':'verbunden','live'); },1300);
  }catch(e){ dirty=true; stat('offline, wird nachgeholt','off'); }
}
async function pull(){
  if(!db) return;
  try{ const {data,error}=await db.from('olympiade').select('data').eq('id',ROW).maybeSingle();
    if(error) throw error;
    if(data&&data.data){ const r=data.data;
      if(!S.stand||(r.stand||0)>=S.stand){ S=r; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} alles(); }
      else if(ADMIN) push();
    } else if(ADMIN) push();
    stat(live?'live':'verbunden','live');
  }catch(e){ stat('offline','off'); }
}
function verbinde(){
  if(!window.supabase){ stat('nur lokal','off'); return; }
  db=window.supabase.createClient(SUPA_URL,SUPA_KEY); pull();
  db.channel('olymp').on('postgres_changes',
    {event:'*',schema:'public',table:'olympiade',filter:'id=eq.'+ROW},p=>{
      const r=p.new&&p.new.data; if(!r) return;
      if((r.stand||0)>(S.stand||0)){ S=r; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} alles(); }
    }).subscribe(st=>{ live=(st==='SUBSCRIBED'); stat(live?'live':'verbunden','live'); });
  setInterval(()=>{ if(dirty) push(); },8000);
  window.addEventListener('online',()=>{ pull(); if(dirty) push(); });
}

/* Tabelle */
function rTab(){
  const el=document.getElementById('tab');
  if(!S.spieler.length){ el.innerHTML='<div class="card"><div class="empty">Noch keine Spieler angelegt.'
    +(ADMIN?'<br>Leg sie unter Setup an.':'')+'</div></div>'; return; }
  const t=tabelle(), mm=['&#x1F947;','&#x1F948;','&#x1F949;'];
  let h='';
  if(t.length>=3){
    h+='<div class="pod">';
    [1,0,2].forEach(i=>h+='<div class="pcol'+(i===0?' p1':'')+'"><div class="pmed">'+mm[i]+'</div>'
      +'<div class="pnm">'+esc(t[i].n)+'</div><div class="ppt">'+t[i].p+'</div></div>');
    h+='</div>';
  }
  h+='<div class="card"><h2>Gesamtwertung</h2>';
  t.forEach((r,i)=>h+='<div class="rank"><div class="pos">'+(i+1)+'</div><div class="nm">'+esc(r.n)
    +'</div><div class="pt">'+r.p+'</div></div>');
  h+='<button class="btn ghost" onclick="teilen()">Stand teilen</button></div>';
  if(t.length>=6){
    const top=t.slice(0,3), bot=t.slice(-3).reverse();
    h+='<div class="card"><h2>Getränke am Ende</h2><div class="settle">';
    [3,2,1].forEach((g,i)=>{ if(top[i]) h+='<b>'+esc(top[i].n)+'</b> bekommt '+g+'<br>'; });
    h+='<div style="height:10px"></div>';
    [3,2,1].forEach((g,i)=>{ if(bot[i]) h+='<b>'+esc(bot[i].n)+'</b> zahlt '+g+'<br>'; });
    h+='</div></div>';
  }
  el.innerHTML=h;
}

/* Spiele, nach Kategorien */
function rSpiele(){
  const el=document.getElementById('spiele');
  let h='';
  if(!ADMIN) h+='<div class="ro">Nur-Lese-Ansicht. Eingetragen wird vom Spielleiter.</div>';
  KAT.k.forEach(([k,titel])=>{
    const liste=S.disz.filter(d=>(d.kat||'einzel')===k);
    if(!liste.length) return;
    h+='<div class="card"><h2>'+titel+'</h2>';
    liste.forEach(d=>{
      const rd=runden(d.id), op=OFFEN[d.id];
      h+='<div class="disz'+(op?' open':'')+'"><div class="dhead" onclick="klapp(\''+d.id+'\')">'
        +'<div class="dot'+(rd.length?' done':'')+'"></div><div class="dinfo">'
        +'<div class="dname">'+esc(d.n)+'</div><div class="dmeta">'+regeltext(d)
        +(rd.length?' &middot; '+rd.length+'x gespielt':'')+'</div></div>'
        +'<div class="chev">&#10095;</div></div><div class="dbody">'
        +'<div class="dtext">'+esc(d.b||'Keine Beschreibung hinterlegt.')+'</div>'
        +(d.m?'<div class="dmat">Material: '+esc(d.m)+'</div>':'')
        +(d.link?'<a class="btn sm lnk" href="'+d.link+'">Seite öffnen</a>':'');
      if(rd.length){
        h+='<div class="runden">';
        rd.forEach((r,i)=>{
          const wer=Object.keys(r.p).sort((a,b)=>r.p[b]-r.p[a])
            .filter(s=>r.p[s]===Math.max.apply(null,Object.values(r.p)));
          h+='<div class="rd"><span>'+(i+1)+'. '+esc(wer.join(', '))+'</span>'
            +(ADMIN?'<button class="rdx" onclick="wegRunde(\''+r.rid+'\')">&times;</button>':'')+'</div>';
        });
        h+='</div>';
      }
      const tm=S.teams&&S.teams[d.id];
      if(tm&&d.modus==='gruppe'&&(tm.a.length||tm.b.length)){
        h+='<div class="teams"><div><b>Team 1</b> '+esc(tm.a.join(', ')||'—')+'</div>'
          +'<div><b>Team 2</b> '+esc(tm.b.join(', ')||'—')+'</div></div>';
      }
      if(ADMIN){
        h+='<button class="btn sm" onclick="oeffne(\''+d.id+'\')">'
          +(d.wdh?'Durchgang eintragen':(rd.length?'Ergebnis ändern':(d.modus==='gruppe'?'Teams und Ergebnis':'Ergebnis eintragen')))+'</button>'
          ;
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function klapp(id){ OFFEN[id]=!OFFEN[id]; rSpiele(); }
function wegRunde(rid){
  if(!confirm('Diesen Durchgang löschen?')) return;
  S.log=S.log.filter(r=>r.rid!==rid); save(); alles();
}

/* Eintragen */
function oeffne(id){
  if(!ADMIN){ alert('Nur der Spielleiter kann eintragen.'); return; }
  if(!S.spieler.length){ alert('Erst Spieler anlegen.'); return; }
  const d=S.disz.find(x=>x.id===id); if(!d) return;
  AUSWAHL=[]; TEILN=S.spieler.length; TEAM={};
  if(d.modus==='gruppe'){
    const tm=S.teams&&S.teams[d.id];
    S.spieler.forEach(sp=>TEAM[sp]=0);
    if(tm){ (tm.a||[]).forEach(x=>{ if(TEAM[x]!==undefined) TEAM[x]=1; });
            (tm.b||[]).forEach(x=>{ if(TEAM[x]!==undefined) TEAM[x]=2; }); }
  }
  let h='<div class="grip"></div><h3>'+esc(d.n)+'</h3>';
  if(d.modus==='gruppe'){
    h+='<div class="hint">Tippe einen Namen an, um zwischen Team 1, Team 2 und nicht dabei zu wechseln. '
      +'Sieger bekommen '+d.win+', Verlierer '+d.lose+', wer nicht mitspielt bekommt nichts.</div>'
      +'<button class="btn ghost sm" onclick="restTeam2(\''+d.id+'\')">Rest in Team 2</button>'
      +'<div id="picks"></div>'
      +'<div class="winrow">'
      +'<button class="btn" onclick="teamSieg(\''+d.id+'\',1)">Team 1 gewinnt</button>'
      +'<button class="btn" onclick="teamSieg(\''+d.id+'\',2)">Team 2 gewinnt</button></div>'
      +'<button class="btn ghost" onclick="teamsMerken(\''+d.id+'\')">Nur Teams merken</button>';
  }else{
    if(d.auto){
      h+='<div class="hint">Wie viele machen mit? Die Punkte skalieren automatisch.</div>'
        +'<label>Teilnehmer</label><input id="tn" type="number" min="2" max="30" value="'+TEILN
        +'" oninput="setTeiln(\''+d.id+'\')"><div class="hint" id="skalatxt"></div>';
    }else{
      h+='<div class="hint">Punkte: '+ptsVon(d).join(' / ')+'. In der Reihenfolge des Ergebnisses antippen.</div>';
    }
    h+='<div id="picks"></div><button class="btn" onclick="speichern(\''+d.id+'\')">Speichern</button>';
  }
  h+='<button class="btn ghost" onclick="zu()">Abbrechen</button>';
  document.getElementById('sheetin').innerHTML=h;
  if(d.modus==='rang'&&d.auto) skalaTxt(d);
  picks(d);
  document.getElementById('sheet').classList.add('on');
}
function restTeam2(id){
  S.spieler.forEach(sp=>{ if(!TEAM[sp]) TEAM[sp]=2; });
  picks(S.disz.find(x=>x.id===id));
}
function teamsMerken(id){
  if(!S.teams) S.teams={};
  S.teams[id]={a:S.spieler.filter(x=>TEAM[x]===1), b:S.spieler.filter(x=>TEAM[x]===2)};
  save(); zu(); alles();
}
function teamSieg(id,sieger){
  const d=S.disz.find(x=>x.id===id);
  const a=S.spieler.filter(x=>TEAM[x]===1), b=S.spieler.filter(x=>TEAM[x]===2);
  if(!a.length||!b.length){ alert('Beide Teams brauchen mindestens einen Spieler.'); return; }
  if(!S.teams) S.teams={};
  S.teams[id]={a:a,b:b};
  const p={};
  a.forEach(x=>p[x]=(sieger===1?d.win:d.lose));
  b.forEach(x=>p[x]=(sieger===2?d.win:d.lose));
  if(!d.wdh) S.log=S.log.filter(r=>r.d!==id);
  S.log.push({rid:'r'+Date.now()+Math.random().toString(36).slice(2,6),d:id,ts:Date.now(),p:p});
  save(); zu(); alles();
}
function setTeiln(id){
  const d=S.disz.find(x=>x.id===id);
  TEILN=Math.max(2,parseInt(document.getElementById('tn').value,10)||2);
  if(AUSWAHL.length>TEILN) AUSWAHL=AUSWAHL.slice(0,TEILN);
  skalaTxt(d); picks(d);
}
function skalaTxt(d){
  const e=document.getElementById('skalatxt');
  if(e) e.textContent='Verteilt wird: '+ptsVon(d,TEILN).join(' / ');
}
function picks(d){
  let h='';
  if(d.modus==='gruppe'){
    S.spieler.forEach(sp=>{
      const t=TEAM[sp]||0;
      h+='<div class="pick'+(t?' t'+t:'')+'" onclick="zykel(\''+esc(sp).replace(/'/g,'')+'\',\''+d.id+'\')">'
        +'<div class="num">'+(t?t:'&middot;')+'</div><div class="nm">'+esc(sp)+'</div>'
        +'<div class="gain">'+(t?'Team '+t:'nicht dabei')+'</div></div>';
    });
  }else{
    const p=ptsVon(d,TEILN);
    S.spieler.forEach(sp=>{
      const i=AUSWAHL.indexOf(sp), sel=i>=0;
      h+='<div class="pick'+(sel?' sel':'')+'" onclick="tippe(\''+esc(sp).replace(/'/g,'')+'\',\''+d.id+'\')">'
        +'<div class="num">'+(sel?i+1:'&middot;')+'</div><div class="nm">'+esc(sp)+'</div>'
        +'<div class="gain">'+(sel&&p[i]!==undefined?'+'+p[i]:'')+'</div></div>';
    });
  }
  document.getElementById('picks').innerHTML=h;
}
function zykel(name,id){
  TEAM[name]=((TEAM[name]||0)+1)%3;
  picks(S.disz.find(x=>x.id===id));
}
function tippe(name,id){
  const d=S.disz.find(x=>x.id===id), i=AUSWAHL.indexOf(name);
  if(i>=0) AUSWAHL.splice(i,1);
  else{ if(AUSWAHL.length>=ptsVon(d,TEILN).length) return; AUSWAHL.push(name); }
  picks(d);
}
function speichern(id){
  const d=S.disz.find(x=>x.id===id);
  if(!AUSWAHL.length){ alert('Niemand ausgewählt.'); return; }
  const p={}, sk=ptsVon(d,TEILN);
  AUSWAHL.forEach((sp,i)=>{ if(sk[i]!==undefined) p[sp]=sk[i]; });
  if(!d.wdh) S.log=S.log.filter(r=>r.d!==id);
  S.log.push({rid:'r'+Date.now()+Math.random().toString(36).slice(2,6),d:id,ts:Date.now(),p:p});
  save(); zu(); alles();
}
function zu(){ document.getElementById('sheet').classList.remove('on'); }

/* Setup */
function rSetup(){
  const el=document.getElementById('setup');
  if(!ADMIN){ el.innerHTML=''; return; }
  let h='<div class="card"><h2>Spieler</h2>';
  S.spieler.forEach((s,i)=>h+='<div class="pick"><div class="nm">'+esc(s)+'</div>'
    +'<button class="gain" onclick="wegSp('+i+')">&times;</button></div>');
  h+='<input id="neu" placeholder="Name" onkeydown="if(event.key===\'Enter\')addSp()">'
    +'<button class="btn" onclick="addSp()">Spieler hinzufügen</button></div>';
  h+='<div class="card"><h2>Disziplin anlegen oder ändern</h2>'
    +'<label>Name</label><input id="dn" placeholder="z. B. Sackhüpfen">'
    +'<label>Beschreibung</label><textarea id="dbx" rows="4"></textarea>'
    +'<label>Material</label><input id="dm" placeholder="Was wird gebraucht?">'
    +'<label>Kategorie</label><select id="dk">'
    +KAT.k.map(([k,t])=>'<option value="'+k+'">'+t+'</option>').join('')+'</select>'
    +'<label>Wertung</label><select id="dmod" onchange="modWechsel()">'
    +'<option value="gruppe">Gruppe: Sieger antippen, Rest bekommt Verliererpunkte</option>'
    +'<option value="rang">Rang: in Reihenfolge antippen</option></select>'
    +'<div id="cfg"></div>'
    +'<label><input type="checkbox" id="dwdh" style="width:auto;margin-right:8px"> Mehrfach spielbar</label>'
    +'<button class="btn" onclick="addDisz()">Disziplin speichern</button>'
    +'<button class="btn ghost" onclick="neuDisz()">Formular leeren</button></div>';
  h+='<div class="card"><h2>Disziplinen verwalten</h2>';
  S.disz.forEach((d,i)=>h+='<div class="pick"><div class="nm">'+esc(d.n)+'</div>'
    +'<button class="gain" onclick="editDisz('+i+')">bearb.</button>'
    +'<button class="gain" onclick="wegDisz('+i+')">&times;</button></div>');
  h+='</div><div class="card"><h2>Zurücksetzen</h2>'
    +'<div class="hint">Ergebnisse löschen behält Spieler und Disziplinen.</div>'
    +'<button class="btn warn" onclick="resErg()">Ergebnisse löschen</button>'
    +'<button class="btn warn" onclick="resAll()">Alles zurücksetzen</button></div>';
  el.innerHTML=h; modWechsel();
}
function modWechsel(){
  const s=document.getElementById('dmod'); if(!s) return;
  document.getElementById('cfg').innerHTML = s.value==='gruppe'
    ? '<label>Punkte Sieger</label><input id="pw" type="number" value="10">'
      +'<label>Punkte Verlierer</label><input id="pl" type="number" value="5">'
    : '<label><input type="checkbox" id="pauto" checked onchange="autoWechsel()" '
      +'style="width:auto;margin-right:8px"> Punkte automatisch aus Teilnehmerzahl</label>'
      +'<div id="pfix" style="display:none"><label>Feste Punkte, mit Komma getrennt</label>'
      +'<input id="pp" value="3, 2, 1"></div>'
      +'<label>Faktor</label><input id="pf" type="number" value="1">';
}
function autoWechsel(){
  const c=document.getElementById('pauto'), f=document.getElementById('pfix');
  if(c&&f) f.style.display=c.checked?'none':'';
}
function neuDisz(){ BEARB=null; rSetup(); }
function editDisz(i){
  const d=S.disz[i]; BEARB=d.id;
  document.getElementById('dn').value=d.n;
  document.getElementById('dbx').value=d.b||'';
  document.getElementById('dm').value=d.m||'';
  document.getElementById('dk').value=d.kat||'einzel';
  document.getElementById('dmod').value=d.modus; modWechsel();
  document.getElementById('dwdh').checked=!!d.wdh;
  if(d.modus==='gruppe'){
    document.getElementById('pw').value=d.win; document.getElementById('pl').value=d.lose;
  }else{
    document.getElementById('pauto').checked=!!d.auto; autoWechsel();
    document.getElementById('pp').value=(d.pts||[3]).join(', ');
    document.getElementById('pf').value=d.faktor||1;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function addDisz(){
  const n=document.getElementById('dn').value.trim();
  if(!n){ alert('Name fehlt.'); return; }
  const modus=document.getElementById('dmod').value;
  const d={id:BEARB||('x'+Date.now()), n:n, modus:modus,
    kat:document.getElementById('dk').value,
    b:document.getElementById('dbx').value.trim(),
    m:document.getElementById('dm').value.trim(),
    wdh:document.getElementById('dwdh').checked, auto:false, faktor:1, pts:[]};
  if(modus==='gruppe'){
    d.win=parseInt(document.getElementById('pw').value,10)||0;
    d.lose=parseInt(document.getElementById('pl').value,10)||0;
  }else{
    d.auto=document.getElementById('pauto').checked;
    d.faktor=parseInt(document.getElementById('pf').value,10)||1;
    d.pts=document.getElementById('pp').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));
    if(!d.auto&&!d.pts.length) d.pts=[3];
  }
  const i=S.disz.findIndex(x=>x.id===d.id);
  if(i>=0) S.disz[i]=d; else S.disz.push(d);
  BEARB=null; save(); alles(); alert('"'+n+'" gespeichert.');
}
function wegDisz(i){
  if(!confirm('"'+S.disz[i].n+'" löschen?')) return;
  const id=S.disz[i].id; S.log=S.log.filter(r=>r.d!==id); S.disz.splice(i,1); save(); alles();
}
function addSp(){
  const i=document.getElementById('neu'), v=i.value.trim(); if(!v) return;
  if(S.spieler.includes(v)){ alert('Name gibt es schon.'); return; }
  S.spieler.push(v); save(); alles();
  const n=document.getElementById('neu'); if(n) n.focus();
}
function wegSp(i){
  if(!confirm('"'+S.spieler[i]+'" entfernen?')) return;
  const n=S.spieler[i]; S.spieler.splice(i,1);
  S.log.forEach(r=>{ delete r.p[n]; }); save(); alles();
}
function resErg(){ if(confirm('Alle Ergebnisse löschen?')){ S.log=[]; save(); alles(); } }
function resAll(){ if(confirm('Wirklich alles zurücksetzen?')){ S=leer(); save(); alles(); } }

/* Teilen */
function teilen(){
  const t=tabelle(); let x='ZWISCHENSTAND OLYMPIADE\n\n';
  t.forEach((r,i)=>x+=(i+1)+'. '+r.n+' — '+r.p+'\n');
  x+='\n'+S.log.length+' Durchgänge gespielt';
  if(navigator.share) navigator.share({text:x}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(x).then(()=>alert('Kopiert.'));
  else prompt('Kopieren:',x);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function alles(){ rTab(); rSpiele(); rSetup(); }


document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['tab','spiele','setup'].forEach(id=>
    document.getElementById(id).style.display=(id===b.dataset.t)?'':'none');
  window.scrollTo({top:0});
});
document.getElementById('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') zu(); });
if(!ADMIN){ const t=document.getElementById('tabsetup'); if(t) t.style.display='none'; }
alles(); verbinde();
</script>
</body>
</html>
